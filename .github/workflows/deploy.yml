name: CI

# Two jobs, and only one of them always runs.
#
#   verify  - tests and generated-file checks. Always. No configuration needed.
#   deploy  - Firebase Hosting + Firestore rules. OPT-IN, and skipped entirely
#             until you set the FIREBASE_PROJECT_ID repository variable.
#
# Deploying from CI is a convenience, not a requirement: `pnpm exec firebase
# deploy` from your laptop does the same thing. So the default is "don't", and
# a fresh fork gets a green CI without touching a single setting.
#
# To turn deployment on:
#   1. pnpm exec firebase init hosting:github
#      It creates a service-account secret for you — but note it names it
#      FIREBASE_SERVICE_ACCOUNT_<YOUR_PROJECT_ID>, not FIREBASE_SERVICE_ACCOUNT.
#      Check Settings > Secrets and variables > Actions and either rename it to
#      FIREBASE_SERVICE_ACCOUNT or change the two references below.
#   2. Add the repository VARIABLE (not secret) FIREBASE_PROJECT_ID.
#   3. For the rules step, grant that service account the
#      "Firebase Rules Admin" role in Google Cloud IAM.
#
# The Firebase web config lives in app/config.js and is committed on purpose -
# it is public, and it is what makes "fork, edit one file, deploy" possible.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile

      - name: Generated files must match data/companies.md
        run: |
          pnpm run seed
          git diff --exit-code app/seed-companies.js README.md \
            || (echo "::error::Generated files are stale - run 'pnpm run seed' and commit the result." && exit 1)

      - name: App and sync behaviour
        run: pnpm test

      - name: Security rules
        run: pnpm run test:rules

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    # No FIREBASE_PROJECT_ID variable means "I deploy from my laptop" — skip
    # the whole job rather than fail it. (`secrets` is not readable in a job-
    # level `if`; `vars` is, which is why the switch is a variable.)
    if: >-
      vars.FIREBASE_PROJECT_ID != '' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: The service-account secret must exist
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo '::error::FIREBASE_PROJECT_ID is set but the FIREBASE_SERVICE_ACCOUNT secret is empty.'
            echo '::error::"firebase init hosting:github" names it FIREBASE_SERVICE_ACCOUNT_<PROJECT_ID>.'
            echo '::error::Rename it in Settings > Secrets and variables > Actions, or edit this workflow.'
            exit 1
          fi

      - name: Deploy Firestore rules
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          # The service account needs the "Firebase Rules Admin" role for this
          # step; drop it if you would rather deploy rules from your laptop.
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          pnpm dlx firebase-tools deploy --only firestore:rules --project "$PROJECT_ID" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"

      - name: Preview channel for this pull request
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          expires: 7d

      - name: Live deploy
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
